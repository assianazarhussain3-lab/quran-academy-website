<h1>Duas & Sanah</h1>

<!-- SANAH -->
<section id="sanah" class="dua-box">
  <h2>Dua-e-Sanah</h2>
  <p class="arabic">سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ...</p>
  <p class="meaning">
    Glory is to You, O Allah, and praise...

  </p>
</section>

<!-- MORNING -->
<section id="morning" class="dua-box">
  <h2>Morning Dua</h2>
  <p class="arabic">اللّهـمَّ بِكَ أَصْبَحْنا...</p>
  <p class="meaning">
    O Allah, by You we enter the morning...
  </p>
</section>

<!-- EATING -->
<section id="eating" class="dua-box">
  <h2>Before Eating</h2>
  <p class="arabic">بِسْمِ اللَّهِ</p>
  <p class="meaning">
    In the name of Allah.
  </p>
</section>
